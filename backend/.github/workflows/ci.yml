name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://catalyst:catalyst@127.0.0.1:5432/catalyst
      LANDING_ROOT: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python warehouse/apply_migrations.py
          pytest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catalyst
          POSTGRES_PASSWORD: catalyst
          POSTGRES_DB: catalyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalyst -d catalyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
