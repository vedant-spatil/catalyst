[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "respx>=0.21",
]

[tool.setuptools]
packages = ["catalog_pipeline", "catalog_api", "warehouse"]

[tool.setuptools.package-dir]
catalog_pipeline = "pipelines/catalog_pipeline"
catalog_api = "apps/api/catalog_api"
warehouse = "warehouse"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipelines", "apps/api", "."]
